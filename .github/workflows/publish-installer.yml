name: Publish tested Windows installer

# The upstream Preview checks on main compiles an Inno Setup installer, then
# really installs/uninstalls it in Windows. Publish ONLY its successful artifact.
# workflow_run exists only on the default branch, so this activates upon PR #7 merge.
on:
  workflow_run:
    workflows: ["Preview checks"]
    types: [completed]
    branches:
      - main

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: publish-installer-main
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
      UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
      UPSTREAM_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout protected main without downloading older installers
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 2
          persist-credentials: true # Only this publish workflow can push.
          lfs: false

      - name: Ensure this was the latest source commit
        id: current
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$UPSTREAM_SHA" ]]; then
            echo 'A newer commit already landed on main; skip obsolete installer.'
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            # Archive-only merges do not create new application installers.
            changed="$(git diff --name-only HEAD^ HEAD)"
            if [[ -n "$changed" ]] && ! grep -qv '^instalador/' <<< "$changed"; then
              echo 'Installer archive-only merge: skip to prevent PR loops.'
              echo 'publish=false' >> "$GITHUB_OUTPUT"
            elif [[ -n "$changed" ]] && ! grep -qvE '^(instalador/|\.github/workflows/publish-installer\.yml$|tests/test_publish_windows_installer\.py$)' <<< "$changed"; then
              # These files govern distribution/reporting, not the Windows
              # binary. Do not generate a fictitious newer application build
              # solely because its release automation was fixed.
              echo 'Installer publisher maintenance only: skip unchanged application build.'
              echo 'publish=false' >> "$GITHUB_OUTPUT"
            else
              echo 'publish=true' >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Download the exact successful upstream installer artifact
        if: steps.current.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/windows-installer-artifact"
          gh run download "$UPSTREAM_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name windows-installer-candidate --dir "$RUNNER_TEMP/windows-installer-artifact"

      - name: Validate PE and SHA256, publish and rotate to five builds
        if: steps.current.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/publish_windows_installer.py \
            --repository . --artifact-dir "$RUNNER_TEMP/windows-installer-artifact" \
            --head-sha "$UPSTREAM_SHA" --run-id "$UPSTREAM_RUN_ID" \
            --run-number "$UPSTREAM_RUN_NUMBER"


      - name: Prepare protected archive PR through Git LFS
        if: steps.current.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git lfs version
          git lfs install --local
          git switch -c "automation/instalador-run-$UPSTREAM_RUN_ID"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- instalador/
          if git diff --cached --quiet; then
            echo 'No changes: this build was already published.'
            exit 0
          fi
          # Fail closed if the actual EXE has been committed to Git instead of LFS.
          for installer in instalador/*.exe; do
            if [[ "$(git check-attr filter -- "$installer")" != "$installer: filter: lfs" ]]; then
              echo "Missing Git LFS tracking for $installer" >&2
              exit 1
            fi
            # The staged Git blob must be a small LFS pointer, never the binary.
            if [[ "$(git show ":$installer" | head -n 1)" != 'version https://git-lfs.github.com/spec/v1' ]]; then
              echo "Git blob is not an LFS pointer: $installer" >&2
              exit 1
            fi
          done
          # A newer merge between checkout and push must not be overwritten.
          git fetch origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo 'main moved; refusing to publish a stale artifact.' >&2
            exit 1
          fi
          git commit -m "chore(instalador): preserve tested Windows build $UPSTREAM_RUN_NUMBER"
          branch="automation/instalador-run-$UPSTREAM_RUN_ID"
          git push --set-upstream origin "$branch"
          # The only distribution is instalador/ on main: open the archive PR,
          # let its protected checks run, then merge it here. A PR opened by the
          # Actions bot gets its pull_request checks held as 'action_required':
          # approve that exact run (this repository's own workflow, on the
          # commit this job just made). No release, no chained workflow_run.
          if ! pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "chore(instalador): archive verified Windows build $UPSTREAM_RUN_NUMBER" \
            --body "Automated archive from successful Windows native CI run $UPSTREAM_RUN_ID. Only instalador/ changes; merged by the publisher after the protected checks pass.")"; then
            echo "::error::ARCHIVE_PR_NOT_CREATED: main/instalador is STALE. The installer is preserved in branch $branch. Enable 'Allow GitHub Actions to create and approve pull requests' under Settings > Actions > General, or open a PR manually."
            exit 1
          fi
          echo "Created archive PR: $pr_url"
          head_sha="$(git rev-parse HEAD)"
          run_id=''
          for attempt in $(seq 1 30); do
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow checks.yml --branch "$branch" \
              --event pull_request --limit 5 --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"$head_sha\") | .databaseId" | head -n 1)"
            [[ -n "$run_id" ]] && break
            sleep 10
          done
          if [[ -z "$run_id" ]]; then
            echo "::error::ARCHIVE_CHECKS_NOT_STARTED: no checks run for $branch; the PR remains open."
            exit 1
          fi
          if [[ "$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" == 'action_required' ]]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/approve"
          fi
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --interval 30 --exit-status > /dev/null
          # Provenance before merging: still open, exact head, only instalador/.
          pr="$(gh pr view "$pr_url" --repo "$GITHUB_REPOSITORY" --json state,headRefOid,baseRefName,files)"
          if ! jq -e --arg sha "$head_sha" \
            '.state == "OPEN" and .headRefOid == $sha and .baseRefName == "main" and (.files | length > 0) and (.files | all(.[]; .path | startswith("instalador/")))' \
            <<< "$pr" > /dev/null; then
            echo '::error::Archive PR provenance or changed paths do not match the checked commit.'
            exit 1
          fi
          if ! gh pr merge "$pr_url" --repo "$GITHUB_REPOSITORY" --merge --delete-branch; then
            echo '::error::ARCHIVE_PR_NOT_MERGED: checks passed, but branch protection or permissions blocked the merge; main/instalador is STALE and the PR remains open.'
            exit 1
          fi
          echo 'Protected checks passed; instalador/ updated on main.'
