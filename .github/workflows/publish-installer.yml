name: Publish tested Windows installer

# The upstream Preview checks on main compiles an Inno Setup installer, then
# really installs/uninstalls it in Windows. Publish ONLY its successful artifact.
# workflow_run exists only on the default branch, so this activates upon PR #7 merge.
on:
  workflow_run:
    workflows: ["Preview checks"]
    types: [completed]
    branches:
      - main
      - 'automation/instalador-*'

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: publish-installer-main
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
      UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
      UPSTREAM_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout protected main without downloading older installers
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 2
          persist-credentials: true # Only this publish workflow can push.
          lfs: false

      - name: Ensure this was the latest source commit
        id: current
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$UPSTREAM_SHA" ]]; then
            echo 'A newer commit already landed on main; skip obsolete installer.'
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            # Archive-only merges do not create new application installers.
            changed="$(git diff --name-only HEAD^ HEAD)"
            if [[ -n "$changed" ]] && ! grep -qv '^instalador/' <<< "$changed"; then
              echo 'Installer archive-only merge: skip to prevent release/PR loops.'
              echo 'publish=false' >> "$GITHUB_OUTPUT"
            else
              echo 'publish=true' >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Download the exact successful upstream installer artifact
        if: steps.current.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/windows-installer-artifact"
          gh run download "$UPSTREAM_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name windows-installer-candidate --dir "$RUNNER_TEMP/windows-installer-artifact"

      - name: Validate PE and SHA256, publish and rotate to five builds
        if: steps.current.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/publish_windows_installer.py \
            --repository . --artifact-dir "$RUNNER_TEMP/windows-installer-artifact" \
            --head-sha "$UPSTREAM_SHA" --run-id "$UPSTREAM_RUN_ID" \
            --run-number "$UPSTREAM_RUN_NUMBER"


      - name: Publish permanent verified GitHub release and keep five
        if: steps.current.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          candidate="$(python3 -c 'import json,os; d=json.load(open("instalador/versoes.json")); print("instalador/"+next(x["arquivo"] for x in d["versoes"] if x["run_id"]==int(os.environ["UPSTREAM_RUN_ID"])))')"
          test -f "$candidate"
          test -f "$candidate.sha256"
          (cd instalador && sha256sum --check --status "$(basename "$candidate.sha256")")
          tag="coletor-installer-run-$UPSTREAM_RUN_ID"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" "$candidate" "$candidate.sha256" \
              --repo "$GITHUB_REPOSITORY" --target "$UPSTREAM_SHA" \
              --title "Coletor Frequência Windows build $UPSTREAM_RUN_NUMBER" \
              --notes "Native-tested installer from successful CI run $UPSTREAM_RUN_ID, commit $UPSTREAM_SHA. SHA-256 attached."
          else
            echo 'Release for this exact CI run already exists.'
          fi
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,publishedAt > "$RUNNER_TEMP/instalador-releases.json"
          python3 - "$RUNNER_TEMP/instalador-releases.json" "$RUNNER_TEMP/obsolete-installer-releases" <<'PY'
          import json
          import re
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              items = json.load(handle)
          ours = [r for r in items if re.fullmatch(r"coletor-installer-run-[1-9][0-9]*", r["tagName"])]
          ours.sort(key=lambda r: (r["publishedAt"] or "", int(r["tagName"].rsplit("-", 1)[1])), reverse=True)
          with open(sys.argv[2], "w", encoding="utf-8") as output:
              output.writelines(r["tagName"] + "\n" for r in ours[5:])
          PY
          while IFS= read -r obsolete; do
            [[ -n "$obsolete" ]] || continue
            gh release delete "$obsolete" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done < "$RUNNER_TEMP/obsolete-installer-releases"

      - name: Prepare protected archive PR through Git LFS
        if: steps.current.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git lfs version
          git lfs install --local
          git switch -c "automation/instalador-run-$UPSTREAM_RUN_ID"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- instalador/
          if git diff --cached --quiet; then
            echo 'No changes: this build was already published.'
            exit 0
          fi
          # Fail closed if the actual EXE has been committed to Git instead of LFS.
          for installer in instalador/*.exe; do
            if [[ "$(git check-attr filter -- "$installer")" != "$installer: filter: lfs" ]]; then
              echo "Missing Git LFS tracking for $installer" >&2
              exit 1
            fi
            # The staged Git blob must be a small LFS pointer, never the binary.
            if [[ "$(git show ":$installer" | head -n 1)" != 'version https://git-lfs.github.com/spec/v1' ]]; then
              echo "Git blob is not an LFS pointer: $installer" >&2
              exit 1
            fi
          done
          # A newer merge between checkout and push must not be overwritten.
          git fetch origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo 'main moved; refusing to publish a stale artifact.' >&2
            exit 1
          fi
          git commit -m "chore(instalador): preserve tested Windows build $UPSTREAM_RUN_NUMBER"
          branch="automation/instalador-run-$UPSTREAM_RUN_ID"
          git push --set-upstream origin "$branch"
          pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch"             --title "chore(instalador): archive verified Windows build $UPSTREAM_RUN_NUMBER"             --body "Automated archive from successful Windows native CI run $UPSTREAM_RUN_ID. Requires the protected verify + windows-portable checks; no branch-protection bypass. Release is already available.")"
          echo "Created archive PR: $pr_url"
          # GITHUB_TOKEN PR creation does not trigger pull_request workflows.
          # Explicit workflow_dispatch is exempt from this restriction.
          gh workflow run checks.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          echo 'The separate workflow_run job will merge only after BOTH dispatched checks succeed.'


  archive-merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      startsWith(github.event.workflow_run.head_branch, 'automation/instalador-run-') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      ARCHIVE_BRANCH: ${{ github.event.workflow_run.head_branch }}
      CHECKED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Merge archive PR only after validated source and both required checks
        shell: bash
        run: |
          set -euo pipefail
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$ARCHIVE_BRANCH" \
            --state open --json number,url,headRefOid,baseRefName,files --limit 5)"
          if ! jq -e --arg sha "$CHECKED_SHA" \
            'length == 1 and .[0].headRefOid == $sha and .[0].baseRefName == "main" and (.[0].files | length > 0) and (.[0].files | all(.[]; .path | startswith("instalador/")))' \
            <<< "$pr" >/dev/null; then
            echo '::error::Archive PR provenance or changed paths do not match the checked commit.'
            exit 1
          fi
          run_id="$(printf '%s' "$ARCHIVE_BRANCH" | sed -n 's@^automation/instalador-run-\([1-9][0-9]*\)$@\1@p')"
          test -n "$run_id"
          gh release view "coletor-installer-run-$run_id" --repo "$GITHUB_REPOSITORY" >/dev/null
          url="$(jq -r '.[0].url' <<< "$pr")"
          if gh pr merge "$url" --repo "$GITHUB_REPOSITORY" --merge; then
            echo 'Protected checks passed; archive merged into main.'
          else
            echo '::warning::Branch protection requires a human action; archive PR remains open. Release is available.'
          fi
