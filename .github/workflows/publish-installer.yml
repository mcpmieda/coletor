name: Publish tested Windows installer

# The upstream Preview checks on main compiles an Inno Setup installer, then
# really installs/uninstalls it in Windows. Publish ONLY its successful artifact,
# as a GitHub Release (owner request 15/11/2026: no installer in the repository).
# Installed Coletors read the latest Release's atualizacao.json and update themselves.
on:
  workflow_run:
    workflows: ["Preview checks"]
    types: [completed]
    branches:
      - main

permissions:
  contents: write # Create and prune Releases.
  actions: read # Download the upstream run's artifact.

concurrency:
  group: publish-installer-main
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
      UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
      UPSTREAM_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout main without downloading older installers
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 2
          persist-credentials: false
          lfs: false

      - name: Ensure this was the latest source commit
        id: current
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$UPSTREAM_SHA" ]]; then
            echo 'A newer commit already landed on main; skip obsolete installer.'
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            changed="$(git diff --name-only HEAD^ HEAD)"
            if [[ -n "$changed" ]] && ! grep -qvE '^(instalador/|\.github/workflows/publish-installer\.yml$|tests/test_publish_windows_installer\.py$)' <<< "$changed"; then
              # These files govern distribution, not the Windows binary. Do not
              # publish a fictitious newer build solely because they changed.
              echo 'Installer publisher maintenance only: skip unchanged application build.'
              echo 'publish=false' >> "$GITHUB_OUTPUT"
            else
              echo 'publish=true' >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Download the exact successful upstream installer artifact
        if: steps.current.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/windows-installer-artifact"
          gh run download "$UPSTREAM_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name windows-installer-candidate --dir "$RUNNER_TEMP/windows-installer-artifact"

      - name: Stage the Release files (PE and SHA-256 checked)
        if: steps.current.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/publish_windows_installer.py \
            --artifact-dir "$RUNNER_TEMP/windows-installer-artifact" --output "$RUNNER_TEMP/release" \
            --head-sha "$UPSTREAM_SHA" --run-id "$UPSTREAM_RUN_ID" \
            --run-number "$UPSTREAM_RUN_NUMBER" > "$RUNNER_TEMP/release.json"
          cat "$RUNNER_TEMP/release.json"

      - name: Publish the Release and keep the five newest
        if: steps.current.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          info="$RUNNER_TEMP/release.json"
          tag="$(jq -r .tag "$info")"
          version="$(jq -r .versao "$info")"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi
          # A slower older run must never become the latest, or Coletors would not see the newer one.
          latest="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2> /dev/null || true)"
          if [[ -n "$latest" && "$(printf '%s\n%s\n' "${latest#v}" "$version" | sort -V | tail -n 1)" != "$version" ]]; then
            echo "Newer Release $latest exists; skip obsolete build $version."
            exit 0
          fi
          mapfile -t files < <(jq -r '.arquivos[]' "$info")
          # gh uploads every file before publishing, so atualizacao.json never points at a missing installer.
          (cd "$RUNNER_TEMP/release" && gh release create "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
            --target "$UPSTREAM_SHA" --title "$(jq -r .titulo "$info")" --notes "$(jq -r .notas "$info")" --latest)
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' \
            | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V -r | tail -n +6 \
            | while read -r old; do
                gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
              done
          echo "Published $tag."
