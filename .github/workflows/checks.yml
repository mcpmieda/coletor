name: Preview checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Generate synthetic fixture
        run: python scripts/generate_fixture.py
      - name: Parser, validation and local security checks
        run: PYTHONPATH=app python -m unittest discover -s tests -v
      - name: Install UI dependencies
        working-directory: ui
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck and production build
        working-directory: ui
        run: |
          npm test
          npm run build
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Synthetic UI smoke test
        run: PYTHONPATH=app QA_OUTPUT=test-results python scripts/check_ui.py
      - name: Preserve synthetic UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-ui-screenshots
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
