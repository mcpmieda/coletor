name: Preview checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Generate synthetic fixture
        run: python scripts/generate_fixture.py
      - name: Parser, validation and local security checks
        run: PYTHONPATH=app python -m unittest discover -s tests -v
      - name: Install UI dependencies
        working-directory: ui
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck and production build
        working-directory: ui
        run: |
          npm test
          npm run build
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Synthetic UI smoke test
        run: PYTHONPATH=app QA_OUTPUT=test-results python scripts/check_ui.py
      - name: Preserve synthetic UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-ui-screenshots
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
  windows-portable:
    needs: verify
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build interface
        working-directory: ui
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run build
      - name: Assemble official embedded runtime and application
        run: python scripts/build_windows_portable.py --source-commit "${{ github.event.pull_request.head.sha }}"
      - name: Verify official Python signatures
        shell: pwsh
        run: |
          $Runtime = 'dist/windows-portable/ColetorFrequencia-0.1.0-teste-windows-x64/programa'
          foreach ($Name in @('python.exe', 'pythonw.exe')) {
            $Signature = Get-AuthenticodeSignature "$Runtime/$Name"
            if ($Signature.Status -ne 'Valid' -or $Signature.SignerCertificate.Subject -notmatch 'Python Software Foundation') {
              throw "Official Python signature validation failed: $Name"
            }
          }
      - name: Open real native window from portable runtime
        run: python scripts/check_windows_portable.py --python "dist/windows-portable/ColetorFrequencia-0.1.0-teste-windows-x64/programa/python.exe" --output-dir artifacts/windows-smoke --timeout 150
      - name: Verify local settings across native close and reopen
        run: python scripts/check_windows_settings.py --python "dist/windows-portable/ColetorFrequencia-0.1.0-teste-windows-x64/programa/python.exe" --output-dir artifacts/windows-settings --timeout 150
      - name: Verify real notification-area menu, preferences and native shutdown
        run: python scripts/check_windows_tray.py --python "dist/windows-portable/ColetorFrequencia-0.1.0-teste-windows-x64/programa/python.exe" --output-dir artifacts/windows-tray --timeout 150
      - name: Create portable test ZIP only after native success
        run: python scripts/build_windows_portable.py --package artifacts/windows-smoke/windows-portable-smoke.json --settings-evidence artifacts/windows-settings/windows-settings-smoke.json --tray-evidence artifacts/windows-tray/windows-tray-smoke.json
      - name: Preserve native test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-evidence
          path: |
            artifacts/windows-smoke/
            artifacts/windows-settings/
            artifacts/windows-tray/
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve private portable test package
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-test
          path: |
            dist/windows-portable/ColetorFrequencia-*.zip
            dist/windows-portable/*.sha256
          if-no-files-found: error
          retention-days: 7

