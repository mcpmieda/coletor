name: Preview checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/preview-diario-anual, feat/manual-session-capture]
permissions:
  contents: read
concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install analysis tools (development only)
        run: python -m pip install ruff==0.14.0 bandit==1.9.4 pip-audit==2.9.0 coverage==7.10.7
      - name: Python lint and selected security rules
        run: |
          ruff check app scripts tests --select E9,F63,F7,F82
          bandit -r app -t B301,B307,B602,B609 -q
      - name: Scan full Git history for secrets (redacted)
        run: |
          curl --fail --location --output /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner --log-opts=--all
      - name: Audit Python runtime and test dependency sets separately
        run: |
          pip-audit --disable-pip --no-deps -r requirements-windows-build.txt
          pip-audit --disable-pip --no-deps -r requirements-windows-portable.txt
          pip-audit -r requirements-test.txt
      - name: Generate synthetic fixture
        run: python scripts/generate_fixture.py
      - name: Parser, validation and local security checks
        run: |
          PYTHONPATH=app coverage run --source=app/coletor -m unittest discover -s tests -v
          coverage report --include="*/parser.py,*/validation.py,*/local_settings.py,*/class_catalog.py,*/class_selection.py,*/manual_session.py" --fail-under=80
      - name: Install UI dependencies
        working-directory: ui
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit UI production and development dependency sets
        working-directory: ui
        run: |
          npm audit --omit=dev --audit-level=moderate
          npm audit --audit-level=moderate
      - name: Typecheck and production build
        working-directory: ui
        run: |
          npm run lint
          npm test
          npm run build
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Synthetic UI smoke test
        run: |
          PYTHONPATH=app QA_OUTPUT=test-results python scripts/check_ui.py
          PYTHONPATH=app QA_OUTPUT=test-results/institutional python scripts/check_institutional_ui.py
      - name: Preserve synthetic UI screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-ui-screenshots
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
  windows-portable:
    needs: verify
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build interface
        working-directory: ui
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run lint
          npm test
          npm run build
      - name: Install hash-locked build dependencies
        run: python -m pip install --require-hashes -r requirements-windows-build.txt
      - name: Assemble official embedded runtime and application
        run: python scripts/build_windows_portable.py --source-commit "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Verify official Python signatures
        shell: pwsh
        run: |
          $Runtime = 'dist/windows-portable/ColetorFrequencia-0.3.0-teste-windows-x64/programa'
          foreach ($Name in @('python.exe', 'pythonw.exe')) {
            $Signature = Get-AuthenticodeSignature "$Runtime/$Name"
            if ($Signature.Status -ne 'Valid' -or $Signature.SignerCertificate.Subject -notmatch 'Python Software Foundation') {
              throw "Official Python signature validation failed: $Name"
            }
          }
      - name: Open real native window from portable runtime
        run: python scripts/check_windows_portable.py --python "dist/windows-portable/ColetorFrequencia-0.3.0-teste-windows-x64/programa/python.exe" --output-dir artifacts/windows-smoke --timeout 150
      - name: Verify local settings across native close and reopen
        run: python scripts/check_windows_settings.py --python "dist/windows-portable/ColetorFrequencia-0.3.0-teste-windows-x64/programa/python.exe" --output-dir artifacts/windows-settings --timeout 150
      - name: Verify real notification-area menu, preferences and native shutdown
        run: python scripts/check_windows_tray.py --python "dist/windows-portable/ColetorFrequencia-0.3.0-teste-windows-x64/programa/python.exe" --output-dir artifacts/windows-tray --timeout 150
      - name: Verify isolated external Edge with every request intercepted or blocked
        run: python scripts/check_manual_browser.py --python "dist/windows-portable/ColetorFrequencia-0.3.0-teste-windows-x64/programa/python.exe" --output artifacts/windows-manual/manual-browser.json
      - name: Verify native manual session, consent and cancellation through external worker
        run: python scripts/check_windows_manual.py --python "dist/windows-portable/ColetorFrequencia-0.3.0-teste-windows-x64/programa/python.exe" --output artifacts/windows-manual/windows-manual.json
      - name: Create portable test ZIP only after native success
        run: python scripts/build_windows_portable.py --package artifacts/windows-smoke/windows-portable-smoke.json --settings-evidence artifacts/windows-settings/windows-settings-smoke.json --tray-evidence artifacts/windows-tray/windows-tray-smoke.json --manual-evidence artifacts/windows-manual/windows-manual.json --browser-evidence artifacts/windows-manual/manual-browser.json
      - name: Preserve native test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-native-evidence
          path: |
            artifacts/windows-smoke/
            artifacts/windows-settings/
            artifacts/windows-tray/
            artifacts/windows-manual/
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve private portable test package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-portable-test
          path: |
            dist/windows-portable/ColetorFrequencia-*.zip
            dist/windows-portable/*.sha256
          if-no-files-found: error
          retention-days: 7

